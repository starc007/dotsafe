[package]
name = "dotsafe-desktop"
description = "dotsafe desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dotsafe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dotsafe-agent.workspace = true
dotsafe-core.workspace = true
dotsafe-integrations.workspace = true
dotsafe-stores.workspace = true
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["serde"] }
zeroize = "1.9.1"
ureq = { version = "3.5.0", features = ["json"] }
whoami = "2.1.3"
keyring = "4.2.0"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3.27.0"
# Runs commands through real IPC on a mock runtime (src/tests.rs).
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSError"] }
objc2-local-authentication = "0.3.2"
