[package]
name = "dotsafe-integrations"
description = "Provider key rotation, deploy-target pushes and the license client for dotsafe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dotsafe-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.0", features = ["json"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
whoami = "2.1.3"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
