[package]
name = "dotsafe-agent"
description = "Agent access for dotsafe: broker protocol, policy, redaction and runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dotsafe-core.workspace = true
aho-corasick = "1.1.5"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
