[package]
name = "dotsafe-core"
description = "Vault format, encryption and sync engine shared by the dotsafe app and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "serde", "v5"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
