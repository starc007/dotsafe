[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
dotsafe-core = { path = "crates/core" }
dotsafe-stores = { path = "crates/stores" }
dotsafe-agent = { path = "crates/agent" }
dotsafe-integrations = { path = "crates/integrations" }

# Optimize the crypto crates even in debug builds, so unlocking with real
# Argon2 settings stays fast during development and tests.
# Note: `cargo remove` deletes overrides for indirect dependencies like blake2.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
